# Pushing a tag like v0.1.0 tests, builds portable binaries and publishes a
# GitHub release with generated notes:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in Cargo.toml. Tags with a `-` (v0.2.0-rc.1)
# become pre-releases. Other tags also publish docs/wiki to the repository's
# wiki.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, for the release notes

      # zig and cargo-zigbuild, which would otherwise be downloaded and compiled
      # every time; their versions are in setup.sh.
      - name: Cache release tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            ~/.local/zigbuild
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/ci/setup.sh') }}

      - name: Set up Rust, zig and cargo-zigbuild
        run: scripts/ci/setup.sh release

      - name: Cache cargo downloads and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          # Every version bump changes Cargo.lock: start from the latest cache.
          restore-keys: release-${{ runner.os }}-

      - name: Formatting, clippy and tests
        run: just ci

      - name: Build portable binaries
        run: scripts/build-release.sh "${{ github.ref_name }}"

      - name: Write release notes
        run: >
          scripts/release-notes.sh "${{ github.ref_name }}"
          "${{ github.server_url }}/${{ github.repository }}"
          > dist/RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          scripts/github-release.sh "${{ github.ref_name }}" dist/RELEASE_NOTES.md
          dist/*.tar.gz dist/*.txt dist/SHA256SUMS

      - name: Publish the documentation to the wiki
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          # The job's own token cannot push to a wiki: add a fine-grained
          # personal access token with Contents read and write access to this
          # repository as the WIKI_TOKEN secret.
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: scripts/publish-wiki.sh "${{ github.ref_name }}"
