# Generated by compost. Requests matched by `ignore` rules of `security` (in
# compost-server.yaml and compost.yaml): Caddy marks them in the access log
# with a field `compost_ignore_<n>` holding the statuses to leave out, or
# `any`. Those are never counted towards a ban.
name: compost/ignore
description: "Requests that `ignore` rules of `security` leave out"
whitelist:
  reason: "security.ignore in compost config"
  expression:
    - "any(keys(evt.Unmarshaled.caddy), {# startsWith 'compost_ignore_' && (evt.Unmarshaled.caddy[#] == 'any' || evt.Meta.http_status in split(evt.Unmarshaled.caddy[#], ' '))})"
