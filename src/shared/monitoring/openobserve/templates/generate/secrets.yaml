    - name: monitoring
      configuration:
        # Password of the root user. Optional: when left out, compost
        # generates one on the first deploy and keeps it on the server. It
        # cannot be changed after the first deploy. OpenObserve requires
        # 8 or more characters with a lowercase and an uppercase letter, a
        # digit and a special character.
        root_password: Change-me-to-a-long-random-string-1
