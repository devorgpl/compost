[package]
name = "depap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Dependency and deployment manager for docker-based servers"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
