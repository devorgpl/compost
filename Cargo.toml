[package]
name = "compost"
version = "1.11.2"
edition = "2024"
rust-version = "1.85"
description = "Dependency and deployment manager for docker-based servers"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
ctrlc = "3"
dirs = "7"
flate2 = "1"
humantime = "2"
ignore = "0.4"
minijinja = { version = "3", features = ["serde"] }
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
similar = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# Small, self-contained release binaries.
[profile.release]
lto = true
codegen-units = 1
strip = true
