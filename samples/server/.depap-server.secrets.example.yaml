# Secrets of the shared applications. Copy to .depap-server.secrets.yaml, which
# `depap server deploy` loads next to depap-server.yaml. Never commit the copy.
#
# Merged by `name` into depap-server.yaml (spec §7), so only the secret keys
# are repeated here.
shared:
  database:
    - name: postgres16
      configuration:
        # Superuser password. Optional: when left out, depap generates one on
        # the first deploy and keeps it on the server. It cannot be changed
        # after the first deploy.
        root_password: change-me-to-a-long-random-string
