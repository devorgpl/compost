# Overlay for trying the samples on this machine (a `--local` server):
# plain HTTP on port 18080, so it does not need ports 80/443 or real domains.
#
#   compost server deploy --apply -f compost-server.yaml,compost-server.local.yaml
shared:
  ingress:
    - name: caddy-main
      configuration:
        http_port: 18080
        https_port: 18443
        tls: "off"
        acme_email: null
  oidc:
    - name: keycloak
      configuration:
        url: http://auth.localhost:18080
  monitoring:
    - name: monitoring
      configuration:
        url: http://logs.localhost:18080
