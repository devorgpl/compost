# Shared applications of the server (spec §5). This file runs them on this
# machine; compost-server.prod.yaml holds what a real server changes.
# Safe to commit: secrets go in .compost-server.secrets.yaml (see
# .compost-server.secrets.example.yaml).
#
#   compost server deploy            # upload files only
#   compost server deploy --apply    # and start the services
shared:
  ingress:
    - name: caddy-main
      type: caddy
      version: 2
      configuration:
        # Plain HTTP on port 18080, so it runs next to anything using 80/443.
        http_port: 18080
        https_port: 18443
        # auto: Let's Encrypt | internal: self-signed | off: plain HTTP
        tls: "off"
        # Log every request; with `monitoring`, the log goes to OpenObserve.
        access_log: true
      # Send its output and metrics to the monitoring app below.
      monitoring: {}
  database:
    - name: postgres18
      type: postgres
      version: 18
      image: postgres:18-alpine
      monitoring: {}
  oidc:
    # Identity provider for app logins. Uses postgres18 (it needs >=18) and
    # the domain of `url` on caddy-main.
    - name: keycloak
      type: keycloak
      version: 26
      configuration:
        url: http://auth.localhost:18080
      monitoring: {}
  monitoring:
    # Logs, metrics and traces of apps and shared apps. Its UI is served on
    # the domain of `url` by caddy-main, which sends its own logs here.
    - name: monitoring
      type: openobserve
      version: 1
      configuration:
        url: http://logs.localhost:18080
