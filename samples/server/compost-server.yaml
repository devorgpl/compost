# Shared applications of the server (spec §5). Safe to commit: secrets go in
# .compost-server.secrets.yaml (see .compost-server.secrets.example.yaml).
#
#   compost server deploy            # upload files only
#   compost server deploy --apply    # and start the services
shared:
  ingress:
    - name: caddy-main
      type: caddy
      version: 2
      configuration:
        http_port: 80
        https_port: 443
        # auto: certificates from Let's Encrypt. Domains must point to this server.
        tls: auto
        acme_email: admin@example.com
  database:
    - name: postgres18
      type: postgres
      version: 18
      image: postgres:18-alpine
  oidc:
    # Identity provider for app logins. Uses postgres18 (it needs >=18) and
    # the domain of `url` on caddy-main.
    - name: keycloak
      type: keycloak
      version: 26
      configuration:
        url: https://auth.example.com
