# Secrets of the shared applications. Copy to .compost-server.secrets.yaml, which
# `compost server deploy` loads next to compost-server.yaml. Never commit the copy.
# On a real server, pass it last:
#
#   compost server deploy --apply -f compost-server.yaml,compost-server.prod.yaml,.compost-server.secrets.yaml
#
# Merged by `name` into compost-server.yaml (spec §7), so only the secret keys
# are repeated here.
shared:
  database:
    - name: postgres18
      configuration:
        # Superuser password. Optional: when left out, compost generates one on
        # the first deploy and keeps it on the server. It cannot be changed
        # after the first deploy.
        root_password: change-me-to-a-long-random-string
  oidc:
    - name: keycloak
      configuration:
        # Password of the Keycloak `admin` user; generated when left out.
        admin_password: change-me-to-a-long-random-string
  monitoring:
    - name: monitoring
      configuration:
        # Password of the OpenObserve root user; generated when left out.
        # OpenObserve requires a lowercase and an uppercase letter, a digit
        # and a special character.
        root_password: Change-me-to-a-long-random-string-1
