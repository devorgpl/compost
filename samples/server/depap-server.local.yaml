# Overlay for trying the samples on this machine (a `--local` server):
# plain HTTP on port 18080, so it does not need ports 80/443 or real domains.
#
#   depap server deploy --apply -f depap-server.yaml,depap-server.local.yaml
shared:
  ingress:
    - name: caddy-main
      configuration:
        http_port: 18080
        https_port: 18443
        tls: "off"
        acme_email: null
