# How sampleapp is deployed (spec §6.1). Safe to commit: domains and secrets
# go in a deployment overlay (see .compost-staging.example.yaml).
name: sampleapp
deployment:
  compose_file: docker-compose.yaml
  # Images are built on the server, so the project folder is uploaded.
  build: true

services:
  database:
    - name: main-db
      type: postgres
      version: ">=16"
      # Both get DATABASE_URL and join the database network.
      targets: [backend, migrate]
      environment:
        DATABASE_URL: db_url

  ingress:
    - name: site
      routes:
        # Longer paths win, so /api goes to the backend and the rest to web.
        - name: api
          target: backend
          port: 5000
          path: /api
        - name: web
          target: web
          port: 8080

  monitoring:
    # Output of all services goes to the monitoring app, if the server runs one.
    - name: telemetry
      optional: true
      targets: [web, backend, migrate]
      # For an OpenTelemetry SDK in the app; the sample does not use one.
      environment:
        OTEL_EXPORTER_OTLP_ENDPOINT: otlp_endpoint
        OTEL_SERVICE_NAME: service_name

# Names that links refer to, mapped to services in docker-compose.yaml.
app_services:
  - name: web
    service: web
  - name: backend
    service: backend
    environment:
      APP_MODE: production
  - name: migrate
    service: migrate

# Saved by `compost app backup` besides database dumps and sources.
backup:
  volumes: [visits]
