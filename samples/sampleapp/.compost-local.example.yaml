# Values for trying the sample on this machine. No secrets (compost generates
# the database password), so it also works as is. Copy to .compost-local.yaml
# and deploy with:
#
#   compost app deploy --apply -f compost.yaml,.compost-local.yaml
#   curl -H 'Host: sampleapp.localhost' http://localhost:18080/api/hits
prefix: local

services:
  ingress:
    - name: site
      domains: ["sampleapp.localhost"]

app_services:
  - name: backend
    environment:
      APP_MODE: local
