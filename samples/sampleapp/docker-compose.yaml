# A plain compose file: depap adds networks and variables in its own override
# file on the server and never changes this one.
services:
  web:
    build: ./web
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - visits:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Runs once before the backend starts, then exits with code 0.
  migrate:
    build: ./backend
    command: ["python", "migrate.py"]

# Named volumes listed under `backup.volumes` in depap.yaml are saved by
# `depap app backup`.
volumes:
  visits:
