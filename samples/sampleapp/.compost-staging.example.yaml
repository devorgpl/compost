# Values for the `staging` instance, including secrets. Copy to
# .compost-staging.yaml (never commit the copy) and deploy with:
#
#   compost app deploy --apply -f compost.yaml,.compost-staging.yaml
#
# Files named .compost-*.yaml are never uploaded with the sources.
prefix: staging

services:
  database:
    - name: main-db
      # Optional. Defaults: sampleapp_staging_main_db for both, and a
      # generated password that compost keeps on the server.
      db_name: sampleapp_staging
      db_user: sampleapp
      db_password: change-me-to-a-long-random-string

  ingress:
    - name: site
      domains: ["staging.example.com", "www.staging.example.com"]

app_services:
  - name: backend
    environment:
      APP_MODE: staging
